version = 1
SPDX-PackageName = "Horizon"
SPDX-PackageSupplier = "Fonden Mærsk Mc-Kinney Møller Center for Zero Carbon Shipping <navigate@zerocarbonshipping.com>"
SPDX-PackageDownloadLocation = "https://github.com/zerocarbonshipping/horizon-zcs"

# Notepad++ user-defined-language files; generated by the Notepad++ UDL
# exporter, so headers would be lost on re-export.
[[annotations]]
path = "syntax/*.xml"
SPDX-FileCopyrightText = "2026 Fonden Mærsk Mc-Kinney Møller Center for Zero Carbon Shipping"
SPDX-License-Identifier = "Apache-2.0"

# Example configuration and template files; kept header-free so they can be
# copied verbatim as starting points.
[[annotations]]
path = "examples/**"
SPDX-FileCopyrightText = "2026 Fonden Mærsk Mc-Kinney Møller Center for Zero Carbon Shipping"
SPDX-License-Identifier = "CC-BY-4.0"
