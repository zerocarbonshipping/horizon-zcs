name: Publish

# as for Navigate: a pushed v* tag publishes the version it names to TestPyPI, and a GitHub
# release published from that tag publishes it to PyPI once a maintainer approves; each
# takes CI's build of the tagged commit
on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # a tag on a commit whose pyproject.toml says another version would publish that one
  version:
    name: Check the tag names the package's version
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Compare the tag with the built version
        run: |
          if ! ls dist/*-"${GITHUB_REF_NAME#v}".tar.gz > /dev/null 2>&1; then
            echo "::error::tag $GITHUB_REF_NAME, but CI built $(ls dist | tr '\n' ' ')"
            exit 1
          fi

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: version
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: version
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
