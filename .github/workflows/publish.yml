name: Publish

# a published GitHub release publishes its tag; PyPI refuses a version it already has
on:
  release:
    types: [ published ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
