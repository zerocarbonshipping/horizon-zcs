name: Publish to TestPyPI

# every push to dev builds a test package numbered by its run, such as 2.0.0.dev42, and
# waits: a reviewer of the testpypi environment approves the run to upload it; a newer
# push cancels a run still waiting
on:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the test package
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # TestPyPI refuses a version it already has, so each run builds its own, X.Y.Z.devN
      - name: Number the version by the run
        run: |
          sed -i -E 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)[^"]*"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
          grep -x 'version = "[0-9.]*dev${{ github.run_number }}"' pyproject.toml

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-artifacts
          path: dist/

  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: testpypi-artifacts
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a re-run of a build already uploaded
