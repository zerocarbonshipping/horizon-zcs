name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install flake8 flake8-bugbear pep8-naming isort

      - name: Run flake8
        run: flake8 horizon

      - name: Run isort
        run: isort horizon --check-only --diff


  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install REUSE tool
        run: pip install reuse

      - name: Check copyright and license metadata
        run: reuse lint


  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build and install the wheel
        run: |
          pip install build
          python -m build
          pip install "$(ls dist/*.whl)"

      - name: Check and sample the example study
        working-directory: examples/uncertainty
        run: |
          horizon --help
          horizon check fuel_cost_study.hor
          horizon run fuel_cost_study.hor --dry-run
