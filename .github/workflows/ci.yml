name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install flake8 flake8-bugbear pep8-naming isort

      - name: Run flake8
        run: flake8 horizon tests

      - name: Run isort
        run: isort horizon tests --check-only --diff


  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install REUSE tool
        run: pip install reuse

      - name: Check copyright and license metadata
        run: reuse lint


  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/


  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Install built wheel with dev dependencies
        run: pip install --force-reinstall "$(ls dist/*.whl)[dev]"

      - name: Verify installation
        run: horizon --help

      - name: Run test suite
        run: pytest

      - name: Run sampling example
        working-directory: examples/uncertainty
        run: horizon fuel_cost_study.hor
