[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-zcs"
dynamic = ["version"]
authors = [
    { name = "Mathias Hintze", email = "mathias.hintze@zerocarbonshipping.com" },
]
maintainers = [
    { name = "Frederik Winkel Lehn", email = "frederik.lehn@zerocarbonshipping.com" },
]
description = "Uncertainty studies of the Navigate maritime transition model, run through any queue"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.22.0",
    "pyDOE3>=1.5",  # lhs(seed=...) needed for reproducible LHS sampling
    "lark>=1.1",
    "pyarrow>=15",
    "polars>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "flake8-bugbear",
    "pep8-naming",
    "isort",
]

[project.urls]
Homepage = "https://www.zerocarbonshipping.com/"
Repository = "https://github.com/zerocarbonshipping/horizon-zcs"

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.setuptools.dynamic]
version = { attr = "horizon.__version__" }

[tool.setuptools.package-data]
"horizon.parser" = ["grammar.lark"]

[project.scripts]
horizon = "horizon.cli:main"

[tool.isort]
profile = "black"
line_length = 120
